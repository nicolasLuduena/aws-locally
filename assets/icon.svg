<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="aws-locally: a cloud with a shell prompt for a face, plugged into your machine">
  <rect width="64" height="64" rx="14" fill="#11161d"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#313c4b"/>
  <!-- the cord: this cloud runs on your machine -->
  <path d="M40 42c0 7 8 5 8 11" fill="none" stroke="#aab4c0" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="43.5" y="52" width="9" height="6.5" rx="1.8" fill="#aab4c0"/>
  <path d="M46 58.5v3M50 58.5v3" stroke="#aab4c0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- the cloud -->
  <g fill="#ffb547">
    <circle cx="21" cy="27" r="9.5"/>
    <circle cx="34" cy="21" r="13"/>
    <circle cx="46" cy="28.5" r="8.5"/>
    <rect x="8" y="25" width="47" height="19" rx="9.5"/>
  </g>
  <!-- its face is a prompt, cursor blinking -->
  <path d="M20 28l6 5-6 5" fill="none" stroke="#1a1206" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="35.4" width="11" height="3.4" rx="1.3" fill="#1a1206">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.55;.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
