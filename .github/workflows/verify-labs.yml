# AWS Emulator ships several releases a day. This proves every lab is still
# solvable against the latest one: fresh emulator per lab, setup, solution, checks.
name: verify-labs
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths: ["course/**", "server/labs.ts", "scripts/verify-labs.ts"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools jq zip
      - run: npm ci
      - run: npm run setup
      - run: npm run verify -- -j 3
